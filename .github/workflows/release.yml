name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/macos.yml'
      - 'packaging/**'
      - 'Makefile'
      - 'VERSION'
      - 'scripts/test.py'
      - 'tests/integration/*package*'
      - 'tests/integration/macos_test.py'
      - 'compiler/**'
      - 'stdlib/**'
      - 'docs/compiler-build/**'

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            architecture: x86_64
            deb_architecture: amd64
            artifact: packages-x86_64
          - runner: ubuntu-22.04-arm
            platform: linux
            architecture: aarch64
            deb_architecture: arm64
            artifact: packages-aarch64
          - runner: windows-2022
            platform: windows
            architecture: x86_64
            artifact: packages-windows-x86_64
          - runner: macos-15
            platform: macos
            architecture: aarch64
            artifact: packages-macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(cat VERSION)"
          version="${version%$'\r'}"
          test "$RELEASE_TAG" = "v$version"
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.5.0'
      - uses: actions/setup-python@v5
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        with:
          python-version: '3.13'
      - name: Install build tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev qemu-user
          opam install dune.3.24.2
      - name: Test packaging and host behavior
        if: matrix.platform == 'linux'
        run: |
          opam exec -- python3 scripts/test.py --suite packaging
          opam exec -- python3 scripts/test.py --suite host
      - name: Build binary distributions
        if: matrix.platform == 'linux'
        run: opam exec -- make release-package PACKAGE_ARCHS=${{ matrix.architecture }}
      - name: Build source distribution
        if: matrix.platform == 'linux' && matrix.architecture == 'x86_64'
        run: make source-package
      - name: Test installation on Debian and Ubuntu
        if: matrix.platform == 'linux'
        env:
          DEB_ARCH: ${{ matrix.deb_architecture }}
        run: |
          for image in debian:12-slim debian:13-slim ubuntu:22.04 ubuntu:24.04 ubuntu:26.04; do
            docker run --rm \
              -v "$PWD/dist:/packages:ro" \
              -v "$PWD/packaging/debian/smoke-test.sh:/smoke-test.sh:ro" \
              "$image" sh /smoke-test.sh \
              "$(basename dist/xen-lang_*_"$DEB_ARCH".deb)" "$(cat VERSION)"
          done
      - name: Build native Windows compiler
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          opam install dune.3.24.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = (opam exec -- ocamlc -config) -join "`n"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($config -notmatch '(?m)^system: (mingw64|win64)\s*$' -or $config -notmatch '(?m)^architecture: amd64\s*$') { throw "Expected native x64 Windows OCaml" }
          opam exec -- dune build '@release'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows ZIP packaging and relocated execution
        if: matrix.platform == 'windows'
        run: opam exec -- python tests/integration/windows_package_test.py
      - name: Create Windows distribution
        if: matrix.platform == 'windows'
        run: opam exec -- python -m packaging.cli --platform windows --architecture x86_64 --formats zip
      - name: Test actual release ZIP with isolated PATH
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python -m packaging.windows.smoke "dist/xen-$version-windows-x86_64.zip" --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and validate native Apple Silicon distribution
        if: matrix.platform == 'macos'
        run: |
          opam install dune.3.24.2
          opam exec -- ocamlc -config | tee ocaml-config.txt
          grep -Eq '^system: macosx$' ocaml-config.txt
          grep -Eq '^architecture: arm64$' ocaml-config.txt
          opam exec -- python3 scripts/test.py --suite macos
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.zip
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Validate assets and generate checksums
        run: python3 -m packaging.github.release
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: assemble
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python3 -m packaging.github.release --tag "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Xen $(cat VERSION)" --generate-notes
          gh release upload "$RELEASE_TAG" dist/*
          prerelease=false
          case "$(cat VERSION)" in *[-_]*|*alpha*|*beta*|*rc*) prerelease=true ;; esac
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
